name: Deploy Libram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the Lua guide
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/libram-guide
          path: .libram-guide
          fetch-depth: 0
      - name: Fetch guide version branches
        working-directory: .libram-guide
        run: git fetch origin '+refs/heads/v*:refs/heads/v*' || echo "No version branches yet."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Project Pages are served at /<repo>/. A user site (username.github.io)
          # should set the repository variable BASE_PATH to /.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          LIBRAM_GUIDE: ${{ github.workspace }}/.libram-guide
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
